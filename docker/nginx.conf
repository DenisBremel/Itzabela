# ============================================================
#  NGINX — sirve la web ya compilada
#  ------------------------------------------------------------
#  La aplicación es estática: HTML, CSS, JS y fotos. No hay
#  servidor de aplicación detrás; los datos vienen de Supabase
#  directamente desde el navegador.
# ============================================================

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nunca anunciamos la versión de nginx.
  server_tokens off;

  # --- Compresión -------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    image/svg+xml font/woff2;

  # --- Cabeceras de seguridad -------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- Archivos con huella en el nombre ---------------------
  # Vite les pone un hash, así que si cambian, cambia la ruta:
  # se pueden cachear un año sin miedo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Tipografías e iconos: misma idea.
  location ~* \.(woff2|woff|ttf|svg|ico|png|jpg|jpeg|webp|avif)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # La configuracion del servidor cambia con cada reinicio.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # --- El index nunca se cachea -----------------------------
  # Es lo que apunta a los assets nuevos tras cada despliegue.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # --- Aplicación de una sola página ------------------------
  # /catalogo, /admin y demás rutas no son archivos: las
  # resuelve React Router, así que todo cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Comprobación de salud para Docker y Dokploy.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
